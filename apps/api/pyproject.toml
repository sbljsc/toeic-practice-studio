[project]
name = "toeic-practice-api"
version = "0.1.0"
description = "Local-only practice API for TOEIC Practice Studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.144.0",
  "python-dotenv==1.2.4",
  "sqlalchemy==2.1.5",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toeic_practice"]
